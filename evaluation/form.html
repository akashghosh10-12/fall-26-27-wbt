<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form method="post">
        <table>
            <h2>Donor Information</h2>
            <tr>
                <td><label for="firstName">First Name* </label></td>
                <td><input type="text" id="firstName" name="firstName" required></td>
            </tr>
            <tr>
                <td><label for="lastName">Last Name* </label></td>
                <td><input type="text" id="lastName" name="lastName" required></td>
            </tr>
            <tr>
                <td><label for="company">Company </label></td>
                <td><input type="text" id="company" name="company"></td>
            </tr>
            <tr>
                <td><label for="address1">Address 1* </label></td>
                <td><input type="text" id="address1" name="address1" required></td>
            </tr>
            <tr>
                <td><label for="address2">Address 2 </label></td>
                <td><input type="text" id="address2" name="address2"></td>
            </tr>
            <tr>
                <td><label for="city">City* </label></td>
                <td><input type="text" id="city" name="city" required></td>
            </tr>
            <tr>
                <td><label for="state">State* </label></td>
                <td><select id="state" name="state" required>
                        <option>Select a State</option>
                </td>
            </tr>
            <tr>
                <td><label for="zipCode">Zip Code* </label></td>
                <td><input type="number" id="zipCode" name="zipCode" required></td>
            </tr>
            <tr>
                <td><label for="country">Country* </label></td>
                <td><select id="country" name="country" required>
                        <option>Select a Country</option>
                </td>
            </tr>
            <tr>
                <td><label>Donation Amount* <br>(Check a button or type in your amount)</label></td>
                <td>
                    <input type="radio" name="amount" value="none">None
                    <input type="radio" name="amount" value="50">$50
                    <input type="radio" name="amount" value="75">$75
                    <input type="radio" name="amount" value="100">$100
                    <input type="radio" name="amount" value="250">$250
                    <input type="radio" name="amount" value="other">Other
                </td>
            </tr>
            <tr>
                <td></td>
                <td><label for="amount">Other Amount </label><input type="number" id="amount" name="amount"></td>
            </tr>
            <tr>
                <td><label>Recurring Donation <br>(Check if yes)</label></td>
                <td>
                    <input type="checkbox" value="intersested"> I am Interested in giving on a regular basis.
                </td>
            </tr>
            <tr>
                <td></td>
                <td><label> Monthly Credit Card $ </label>
                    <input type="number" id="credit" name="credit">
                    <label> For </label>
                    <input type="number" id="months" name="months">
                </td>
            </tr>
        </table>
        <table>
            <h2>Honorarium and Memorial Donation Information</h2>
            <tr>
                <td><label>I would like to do this donation</label></td>
                <td>
                    <input type="radio" name="donationReason" value="honor">To Honor
                    <input type="radio" name="donationReason" value="memory">To Memory of
                </td>
            </tr>
            <tr>
                <td><label for="name">Name </label></td>
                <td><input type="text" id="name" name="name" required></td>
            </tr>
            <tr>
                <td><label for="donationto">Acknowledge Donation to </label></td>
                <td><input type="text" id="donationto" name="donationto"></td>
            </tr>
            <tr>
                <td><label for="address">Address </label></td>
                <td><input type="text" id="address" name="address"></td>
            </tr>
            <tr>
                <td><label for="city">City </label></td>
                <td><input type="text" id="city" name="city"></td>
            </tr>
            <tr>
                <td><label for="state">State </label></td>
                <td><select id="state" name="state" required>
                        <option>Select a State</option>
                </td>
            </tr>
            <tr>
                <td><label for="zip">Zip </label></td>
                <td><input type="number" id="zip" name="zip"></td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="reset" value="Reset">
                    <input type="submit" value="Continue">
                </td>
            </tr>
        </table>
    </form>
</body>

</html>
